<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}/* ===================== v2 : thème Bloomberg unifié ===================== */
:root{
  --bg:#000; --panel:#000; --panel-2:#0b0b0b; --line:#1f1f1f; --line-2:#333;
  --fg:#E8E8E8; --muted:#C9A15B; --faint:#7d6e55;
  --accent:#FF9F1A; --amber:#FFB000; --accent-ink:#000; --link:#5AC8FA;
  --up:#1EE37A; --down:#FF4545; --warn:#FFD000; --info:#5AC8FA;
  --hdr:#121212; --r:0px;
}
body{font-size:12.5px;letter-spacing:.01em;background:#000}
/* barre du haut : marque, ligne de commande façon <GO> */
.top{background:#000;border-bottom:1px solid var(--accent)}
.brand{color:var(--amber);letter-spacing:.12em;text-transform:uppercase;font-size:12px}
.brand .logo{border-radius:0;background:var(--amber)}
.cmd{border-radius:0;background:#0b0b0b;border-color:#3a2a10}
.cmd:focus-within{border-color:var(--amber)}
.cmd span{color:var(--amber)}
.cmd input{color:var(--amber);caret-color:var(--amber)}
.icon-btn{border-radius:0;background:#0b0b0b;border-color:#333;text-transform:uppercase;font-size:11px;letter-spacing:.04em}
.icon-btn:hover{border-color:var(--amber);color:var(--amber)}
/* onglets = touches de fonction */
.tabs-row{gap:4px;padding:4px 8px;border-top:1px solid #1a1a1a;background:#050505}
.tab{border:1px solid #2a2a2a !important;border-bottom:1px solid #2a2a2a !important;background:#111 !important;color:var(--amber) !important;padding:4px 10px;text-transform:uppercase;font-size:11px;letter-spacing:.05em;border-radius:0}
.tab:hover{border-color:var(--amber) !important}
.tab[aria-selected="true"]{background:var(--amber) !important;color:#000 !important;border-color:var(--amber) !important}
/* grille et panneaux */
.grid{background:#000;gap:6px}
.panel{background:#000 !important;border:1px solid #262626 !important;border-radius:0 !important;box-shadow:none !important}
.panel:hover{border-color:#3a3a3a !important}
.ph{background:var(--hdr) !important;border-bottom:1px solid #2a2a2a !important;min-height:26px;padding:0 6px 0 8px;gap:6px}
.ph h2{color:var(--amber) !important;font-size:11px !important;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.ph .ph-time{color:#777;font-size:10px;font-family:var(--f-data)}
.ph button.x{color:#666}
.ph button.x:hover{color:var(--down)}
.pb{background:#000}
.rz{opacity:.5}
/* pastilles de source */
.badge{border-radius:0;font-size:9px;letter-spacing:.06em;padding:1px 4px}
/* tableaux denses façon terminal */
table{font-size:11.5px}
th{color:var(--amber);text-transform:uppercase;font-size:10px;letter-spacing:.05em;font-weight:600;background:#0a0a0a;border-bottom:1px solid #2a2a2a !important}
th,td{padding:3px 6px}
tbody tr:nth-child(even){background:#070707}
tbody tr:hover{background:#151515}
tbody tr.click:hover{background:#1c1406}
/* barres d'outils et boutons */
.toolbar{background:#060606;border-bottom:1px solid #1c1c1c;padding:3px 6px;gap:4px;min-height:28px}
.btn,.seg button{border-radius:0 !important;background:#0d0d0d;border:1px solid #2e2e2e;color:#ddd;font-size:11px;padding:2px 7px;text-transform:none}
.btn:hover,.seg button:hover{border-color:var(--amber);color:var(--amber)}
.btn.on,.seg button.on{background:var(--amber) !important;color:#000 !important;border-color:var(--amber) !important}
.seg{border-radius:0;gap:0}
.inp,select.inp,input.inp{border-radius:0 !important;background:#0b0b0b;border:1px solid #333;color:var(--amber)}
.inp:focus{border-color:var(--amber)}
.menu{border-radius:0;background:#0b0b0b;border:1px solid var(--amber)}
.menu button:hover{background:#1c1406;color:var(--amber)}
.modal{border-radius:0;border:1px solid var(--amber);background:#0b0b0b}
.toast{border-radius:0;border-left:3px solid var(--amber)}
.stat{border-radius:0 !important;background:#0b0b0b !important;border:1px solid #222 !important}
.stat .l{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.05em}
.tile{border-radius:0 !important}
/* états des panneaux : chargement / vide / erreur, toujours le même rendu */
.empty{color:#8a8a8a;font-size:12px;padding:18px 12px;text-align:center}
.empty b{color:var(--amber)}
.state{display:flex;align-items:center;gap:8px;justify-content:center;padding:16px;color:#8a8a8a;font-size:12px}
.state.err{color:var(--down)}
.state .dot{width:6px;height:6px;background:var(--amber);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.hint{color:#777;font-size:10.5px}
/* défilement discret */
*{scrollbar-width:thin;scrollbar-color:#333 #000}
::-webkit-scrollbar{width:7px;height:7px} ::-webkit-scrollbar-thumb{background:#333} ::-webkit-scrollbar-track{background:#000}
@media (max-width:820px){ .ph h2{font-size:10.5px !important} .tab{padding:4px 8px} }

<title>Terminal de Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* Terminal de trading : barre de commande en haut, onglets d'espaces de travail, grille de panneaux déplaçables/redimensionnables. */
:root{
  color-scheme:dark;
  --bg:#000000; --panel:#0A0A0A; --panel-2:#141414; --line:#262626; --line-2:#3A3A3A;
  --fg:#F2F2F2; --muted:#FFB347; --faint:#8C7A5C;
  --accent:#FF8C00; --accent-ink:#000000; --link:#4FC3F7;
  --up:#00E676; --down:#FF3D3D; --warn:#FFD000; --info:#4FC3F7;
  --up-bg:rgba(0,230,118,.13); --down-bg:rgba(255,61,61,.13);
  --sim:#FFD000;
  --f-body:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:2px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#EEF2F4; --panel:#FFFFFF; --panel-2:#F4F7F8; --line:#DCE3E7; --line-2:#C5D0D6;
  --fg:#11202A; --muted:#566B75; --faint:#8396A0;
  --accent:#B87900; --accent-ink:#FFFFFF; --link:#0D6FA8;
  --up:#0E9F62; --down:#D42D4D; --warn:#B87900; --info:#0D6FA8;
  --up-bg:rgba(14,159,98,.12); --down-bg:rgba(212,45,77,.12);
  --sim:#C2621B;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:13px;line-height:1.45;margin:0;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
.mono,.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)} .faint{color:var(--faint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* barre supérieure */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--panel);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding:8px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand .logo{width:22px;height:22px;border-radius:5px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-data);font-size:12px;font-weight:600}
.cmd{flex:1 1 320px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:0 10px;min-width:0}
.cmd span{color:var(--accent);font-family:var(--f-data);font-weight:600}
.cmd input{flex:1;min-width:0;background:none;border:0;outline:0;padding:7px 0;font-family:var(--f-data);text-transform:uppercase}
.cmd input::placeholder{text-transform:none;color:var(--faint)}
.cmd kbd{font-family:var(--f-data);font-size:10px;color:var(--faint);border:1px solid var(--line-2);border-radius:4px;padding:1px 5px}
.sessions{display:flex;gap:10px;font-family:var(--f-data);font-size:11px;flex-wrap:wrap}
.sess{display:flex;align-items:center;gap:5px;color:var(--muted)}
.sess i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.sess.open i{background:var(--up);box-shadow:0 0 6px var(--up)}
.sess b{color:var(--fg);font-weight:500}
.icon-btn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.icon-btn:hover{border-color:var(--accent)}
.tabs-row{display:flex;align-items:center;gap:2px;padding:0 10px;border-top:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:7px 12px;cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:600}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab:hover{color:var(--fg)}
.tabs-row .spacer{flex:1}
.status{display:flex;gap:8px;font-family:var(--f-data);font-size:10px;color:var(--faint);white-space:nowrap;padding:4px 0}
.src{display:flex;align-items:center;gap:4px}
.src i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.src.ok i{background:var(--up)} .src.err i{background:var(--down)} .src.sim i{background:var(--sim)}

/* ticker défilant */
.tape{overflow:hidden;border-top:1px solid var(--line);background:var(--bg);white-space:nowrap;font-family:var(--f-data);font-size:11px}
.tape-in{display:inline-block;padding:4px 0;animation:tape 60s linear infinite}
.tape:hover .tape-in{animation-play-state:paused}
.tape-in span{margin:0 14px;cursor:pointer}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* grille de panneaux */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:44px;gap:8px;padding:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;overflow:hidden}
.panel.drag-over{outline:2px dashed var(--accent);outline-offset:-2px}
.panel.dragging{opacity:.5}
.ph{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 10px;border-bottom:1px solid var(--line);background:var(--panel-2);cursor:grab;user-select:none;min-height:30px}
/* look terminal : en-têtes orange en majuscules, coins carrés, texte dense */
:root:not([data-theme="light"]) .ph{background:#1A0F00;border-bottom:1px solid var(--accent);color:var(--accent);text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:600}
:root:not([data-theme="light"]) .top{background:#000;border-bottom:2px solid var(--accent)}
:root:not([data-theme="light"]) .tab{text-transform:uppercase;font-size:11px;letter-spacing:.05em;color:#B0B0B0}
:root:not([data-theme="light"]) .tab[aria-selected="true"]{background:var(--accent);color:#000;border-bottom-color:var(--accent)}
:root:not([data-theme="light"]) .brand{color:var(--accent);text-transform:uppercase}
:root:not([data-theme="light"]) .panel{border-color:#2A2A2A}
:root:not([data-theme="light"]) .grid{gap:4px;padding:4px}
:root:not([data-theme="light"]) body{font-size:12px}
.ph h2{margin:0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .sp{flex:1}
.ph .badge{margin-left:2px}
.ph button.x{background:none;border:0;color:var(--faint);cursor:pointer;padding:0 4px;font-size:15px;line-height:1}
.ph button.x:hover{color:var(--down)}
.pb{flex:1;min-height:0;overflow:auto;position:relative}
.pb.pad{padding:8px 10px}
.rz{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;z-index:5;background:linear-gradient(135deg,transparent 50%,var(--line-2) 50%,var(--line-2) 60%,transparent 60%,transparent 72%,var(--line-2) 72%,var(--line-2) 82%,transparent 82%)}
@media (max-width:820px){
  .grid{grid-template-columns:1fr;grid-auto-rows:auto;padding:8px 16px}
  .panel{grid-column:1/-1!important;grid-row:auto!important;height:var(--mh,420px)}
  .rz{display:none}
  .sessions{display:none}
}

/* éléments communs */
.badge{font-family:var(--f-data);font-size:9px;font-weight:600;letter-spacing:.06em;padding:1px 5px;border-radius:3px;border:1px solid currentColor;text-transform:uppercase;white-space:nowrap}
.badge.live{color:var(--up)} .badge.delay{color:var(--info)} .badge.sim{color:var(--sim)} .badge.ref{color:var(--muted)} .badge.manual{color:var(--accent)}
table{border-collapse:collapse;width:100%}
th,td{padding:3px 8px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);position:sticky;top:0;background:var(--panel);z-index:1;border-bottom:1px solid var(--line)}
tbody tr{border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--panel-2)}
tbody tr.active{background:color-mix(in srgb,var(--accent) 10%,transparent)}
td.num,td.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.flash-up{animation:fu .8s}
.flash-down{animation:fd .8s}
@keyframes fu{from{background:var(--up-bg)}to{background:transparent}}
@keyframes fd{from{background:var(--down-bg)}to{background:transparent}}
.toolbar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:5px 8px;border-bottom:1px solid var(--line)}
.btn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:5px;padding:3px 8px;cursor:pointer;font-size:11px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.buy{background:var(--up);color:#00180D;border-color:var(--up)}
.btn.sell{background:var(--down);color:#22000A;border-color:var(--down)}
.btn.ghost{background:none}
.inp{background:var(--bg);border:1px solid var(--line-2);border-radius:5px;padding:3px 7px;min-width:0}
.inp.mono{text-transform:uppercase}
.sep{width:1px;align-self:stretch;background:var(--line);margin:0 3px}
.empty{padding:18px 12px;color:var(--muted);text-align:center;font-size:12px}
.empty b{color:var(--fg)}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;align-items:baseline}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-data);text-align:right}
.hint{font-size:11px;color:var(--faint);margin:6px 0 0}
.field{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)}
.field .inp{color:var(--fg);font-family:var(--f-data)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:5px;overflow:hidden}
.seg button{background:none;border:0;padding:3px 8px;cursor:pointer;font-size:11px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

/* graphique */
.chart-wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.chart-main{flex:1;min-height:120px;position:relative}
.chart-sub{height:90px;border-top:1px solid var(--line);position:relative}
.legend{position:absolute;left:8px;top:6px;z-index:4;font-family:var(--f-data);font-size:11px;pointer-events:none;color:var(--muted)}
.legend b{color:var(--fg);font-size:12px}
.sub-label{position:absolute;left:8px;top:3px;z-index:4;font-family:var(--f-data);font-size:10px;color:var(--faint);pointer-events:none}
.chart-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);z-index:3;pointer-events:none}

/* carnet d'ordres */
.book{display:grid;grid-template-columns:1fr 1fr;height:100%;min-height:0}
.book>div{overflow:auto;min-height:0}
.ob .lvl{display:grid;grid-template-columns:1fr 1fr;font-family:var(--f-data);font-size:11px;padding:1px 8px;position:relative}
.ob .lvl span{position:relative;z-index:1}
.ob .lvl span:last-child{text-align:right}
.ob .lvl .bar{position:absolute;top:0;bottom:0;right:0;z-index:0}
.ob .bid .bar{background:var(--up-bg)} .ob .ask .bar{background:var(--down-bg)}
.spread{grid-column:1/-1;text-align:center;font-family:var(--f-data);font-size:11px;padding:3px;border-block:1px solid var(--line);color:var(--muted)}

/* news */
.news-item{padding:7px 10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:2px 8px;cursor:pointer}
.news-item:hover{background:var(--panel-2)}
.news-item.fresh{box-shadow:inset 3px 0 0 var(--accent)}
.news-item time{font-family:var(--f-data);font-size:10px;color:var(--faint);grid-row:span 2;padding-top:2px}
.news-item h3{margin:0;font-size:12.5px;font-weight:600;line-height:1.35}
.news-item .meta{font-size:10.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.senti{font-family:var(--f-data);font-size:9px;font-weight:600;padding:0 4px;border-radius:3px}
.senti.pos{background:var(--up-bg);color:var(--up)} .senti.neg{background:var(--down-bg);color:var(--down)} .senti.neu{background:var(--panel-2);color:var(--muted)}

/* calendrier */
.cal-day{padding:4px 10px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--panel-2);position:sticky;top:0;z-index:1}
.cal-ev{display:grid;grid-template-columns:44px 26px 1fr auto;gap:6px;padding:4px 10px;border-bottom:1px solid var(--line);align-items:center;font-size:12px}
.cal-ev .t{font-family:var(--f-data);color:var(--muted);font-size:11px}
.cal-ev .c{font-family:var(--f-data);font-size:10px;font-weight:600}
.imp{display:inline-flex;gap:2px}
.imp i{width:5px;height:9px;border-radius:1px;background:var(--line-2)}
.imp.h3 i{background:var(--down)} .imp.h2 i:nth-child(-n+2){background:var(--warn)} .imp.h1 i:first-child{background:var(--muted)}
.cal-ev.past{opacity:.5}

/* heatmap */
.heat{display:flex;flex-wrap:wrap;gap:2px;padding:4px;align-content:flex-start;height:100%}
.tile{flex-grow:1;min-width:64px;min-height:44px;border-radius:3px;padding:4px 6px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;color:#fff;overflow:hidden}
.tile b{font-family:var(--f-data);font-size:11px;white-space:nowrap}
.tile span{font-family:var(--f-data);font-size:10.5px;opacity:.9}
.tile small{font-size:9.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* courbe des taux */
.curve-svg{width:100%;height:100%;display:block}
.curve-svg text{font-family:var(--f-data)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;padding:8px}
.stat{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;position:relative}
.stat .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:4px;align-items:center}
.stat .v{font-family:var(--f-data);font-size:17px;font-weight:500;margin-top:2px}
.stat .d{font-family:var(--f-data);font-size:10.5px;color:var(--faint)}
.stat.edit{cursor:pointer}
.stat.edit:hover{border-color:var(--accent)}
.gauge{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--down),var(--warn),var(--up));position:relative;margin-top:6px}
.gauge i{position:absolute;top:-3px;width:3px;height:12px;background:var(--fg);border-radius:1px}

.demo-bar{background:color-mix(in srgb,var(--sim) 16%,var(--panel));border-bottom:1px solid var(--sim);color:var(--fg);padding:7px max(16px,env(safe-area-inset-left,0px));font-size:12px}
.demo-bar b{color:var(--sim)}
/* modales, toasts */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:grid;place-items:center;padding:16px}

.menu{position:fixed;z-index:120;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:4px;box-shadow:0 8px 30px rgba(0,0,0,.4);min-width:220px;max-height:70vh;overflow:auto}

/* ============================== utilitaires ============================== */
const $ = (s, r = document) => r.querySelector(s);

const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));

};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const fmtN = (n, d = 2) => n == null || !isFinite(n) ? "—" : Number(n).toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtPct = (n, d = 2) => n == null || !isFinite(n) ? "—" : (n > 0 ? "+" : "") + fmtN(n, d) + " %";
const fmtBig = n => { if (n == null || !isFinite(n)) return "—"; const a = Math.abs(n); return a >= 1e12 ? fmtN(n / 1e12, 2) + " T" : a >= 1e9 ? fmtN(n / 1e9, 2) + " Md" : a >= 1e6 ? fmtN(n / 1e6, 2) + " M" : a >= 1e3 ? fmtN(n / 1e3, 1) + " k" : fmtN(n, 0); };
const fmtMoney = (n, cur = "€") => n == null || !isFinite(n) ? "—" : (n < 0 ? "−" : "") + fmtN(Math.abs(n), 2) + " " + cur;

const store = {
  get(k, d) { try { const v = localStorage.getItem("tt." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) {
    const txt = JSON.stringify(v);
    try { localStorage.setItem("tt." + k, txt); return true; } catch { }
    // mémoire du navigateur pleine : on vide les caches (re-téléchargeables) pour garder l'essentiel (disposition, journal, réglages)
    for (const c of ["fred.cache", "tr.fr", "hl.cache", "newsSeen", "cmdHist", "cal.ann"]) { if (c === k) continue; try { localStorage.removeItem("tt." + c); } catch { } }
    try { Object.keys(localStorage).filter(x => /^tdb-.*(cache|hist)/i.test(x)).forEach(x => localStorage.removeItem(x)); } catch { }
    try { localStorage.setItem("tt." + k, txt); return true; } catch { }
    if (!store._warned) { store._warned = true; setTimeout(() => { try { toast("⚠ Ton navigateur refuse d'enregistrer (navigation privée ou « Bloquer tous les cookies » activé dans Réglages → Safari). Tes modifications seront perdues en quittant.", "down"); } catch { } }, 1500); }
    return false;
  }
};
/* nettoyage au démarrage : les gros caches ne doivent jamais empêcher d'enregistrer la disposition */
try { for (const c of ["fred.cache", "hl.cache", "tr.fr"]) { const v = localStorage.getItem("tt." + c); if (v && v.length > 600000) localStorage.removeItem("tt." + c); } } catch { }
try { localStorage.setItem("tt.__test", "1"); localStorage.removeItem("tt.__test"); } catch { setTimeout(() => { try { toast("⚠ Ton navigateur bloque l'enregistrement : vérifie que tu n'es pas en navigation privée et que « Bloquer tous les cookies » est désactivé (Réglages → Safari).", "down"); } catch { } }, 2000); }

const bus = {
  m: {},
  on(e, f) { (this.m[e] ||= new Set()).add(f); return () => this.m[e].delete(f); },
  emit(e, ...a) { this.m[e]?.forEach(f => { try { f(...a); } catch (err) { console.error(e, err); } }); }
};

function toast(msg, kind = "") {
  const t = h("div", { class: "toast " + kind, html: msg });

}
// Boîtes de dialogue intégrées : prompt()/confirm() sont bloqués dans certains lecteurs (app Claude, iframes)
function ask(label, value = "", { ok = "Valider", confirmOnly = false, danger = false } = {}) {
  return new Promise(res => {
    const bg = h("div", { class: "modal-bg" });
    const inp = confirmOnly ? null : h("input", { class: "inp", id: "ask-input", value: String(value ?? ""), style: "width:100%;padding:7px 9px;font-family:var(--f-data)" });
    const done = v => { bg.remove(); res(v); };
    const form = h("form", { class: "modal", style: "width:min(420px,100%)" },
      h("p", { style: "color:var(--fg);margin:0 0 10px" }, label), inp,
      h("div", { class: "row", style: "justify-content:flex-end;margin-top:12px" },
        h("button", { type: "button", class: "btn", onclick: () => done(confirmOnly ? false : null) }, "Annuler"),
        h("button", { class: "btn " + (danger ? "sell" : "on") }, ok)));
    form.onsubmit = e => { e.preventDefault(); done(confirmOnly ? true : inp.value); };
    bg.onclick = e => { if (e.target === bg) done(confirmOnly ? false : null); };
    bg.addEventListener("keydown", e => { if (e.key === "Escape") { e.stopPropagation(); done(confirmOnly ? false : null); } });
    bg.append(form); document.body.append(bg);
    (inp || form.querySelector("button:last-child")).focus(); inp?.select();
  });
}
const askOk = (msg, ok = "Confirmer") => ask(msg, "", { confirmOnly: true, ok, danger: true });
const askNum = async (label, value) => { const v = await ask(label, value); if (v == null || v.trim() === "") return null; const n = +v.replace(",", ".").replace(/\s/g, ""); return isFinite(n) ? n : (toast("Valeur invalide : saisis un nombre.", "down"), null); };
// Enregistre un fichier : capacité « downloads » du lecteur Claude si présente, sinon lien de téléchargement classique

function beep(up = true) {
  try {
    const ctx = beep.ctx ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = up ? 880 : 440; g.gain.value = 0.06;
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.18);
  } catch { /* audio non autorisé */ }
}

/* ============================== état global ============================== */
const DEFAULT_WATCH = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "AAPL", "MSFT", "NVDA", "TSLA", "SPY", "QQQ", "MC.PA", "TTE.PA", "EUR/USD"];
const S = {
  keys: store.get("keys", { finnhub: "", twelve: "" }),
  active: store.get("active", "BTCUSDT"),
  watch: store.get("watch", DEFAULT_WATCH),
  alerts: store.get("alerts", []),
  theme: store.get("theme", "dark"),
  manual: store.get("manual", {}),
};
const save = k => store.set(k, S[k]);
function setActive(sym) {
  sym = normSym(sym); if (!sym) return;
  S.active = sym; save("active");
  bus.emit("active", sym);
}
function normSym(s) {
  s = String(s || "").trim().toUpperCase();
  if (!s) return "";
  if (/^[A-Z]{3}[\/-][A-Z]{3}$/.test(s)) return s.replace("-", "/");
  return s;
}
const isCrypto = s => /^[A-Z0-9]{2,12}(USDT|USDC|FDUSD|BTC|ETH|EUR)$/.test(s) && !s.includes("/") && !s.includes(".") && s.length >= 6;
const isFx = s => s.includes("/");
const assetKind = s => isCrypto(s) ? "crypto" : isFx(s) ? "fx" : "stock";

/* ============================== statut des sources ============================== */
const SRC = {
  binance: { label: "Binance", st: "idle" }, finnhub: { label: "Finnhub", st: "idle" }, twelve: { label: "TwelveData", st: "idle" },
  ecb: { label: "BCE", st: "idle" }, nyfed: { label: "NY Fed", st: "idle" }, ust: { label: "Trésor US", st: "idle" },
  fx: { label: "Frankfurter", st: "idle" }, other: { label: "Autres", st: "idle" }, sim: { label: "Simulateur", st: "idle" }
};
function srcSet(k, st) { if (SRC[k] && SRC[k].st !== st) { SRC[k].st = st; renderStatus(); } }
function renderStatus() {
  $("#status").innerHTML = Object.values(SRC).filter(s => s.st !== "idle")
    .map(s => `<span class="src ${s.st}" title="${s.label} : ${s.st === "ok" ? "connecté" : s.st === "sim" ? "données simulées" : "erreur / bloqué"}"><i></i>${s.label}</span>`).join("");
}
async function getJSON(url, src = "other", { timeout = 12000, text = false } = {}) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), timeout);
  try {
    const r = await fetch(url, { signal: ctl.signal });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const out = text ? await r.text() : await r.json();
    if (!text && out && (out.status === "error" || out.error)) throw new Error(out.message || out.error);
    srcSet(src, "ok");
    return out;
  } catch (e) { srcSet(src, "err"); throw e; } finally { clearTimeout(t); }
}
// File d'attente pour respecter les limites des offres gratuites
class RateQueue {
  constructor(ms) { this.ms = ms; this.q = []; this.busy = false; }
  push(fn) { return new Promise((res, rej) => { this.q.push({ fn, res, rej }); this.run(); }); }
  async run() {
    if (this.busy) return; this.busy = true;
    while (this.q.length) { const { fn, res, rej } = this.q.shift(); try { res(await fn()); } catch (e) { rej(e); } await sleep(this.ms); }
    this.busy = false;
  }
}
const FQ = new RateQueue(1100);   // Finnhub : 60 req/min
const TQ = new RateQueue(8000);   // Twelve Data : 8 req/min
const fh = path => FQ.push(() => getJSON(`https://finnhub.io/api/v1${path}${path.includes("?") ? "&" : "?"}token=${encodeURIComponent(S.keys.finnhub)}`, "finnhub"));
function tdSymParams(sym) {
  const m = sym.match(/^([A-Z0-9]+)\.PA$/);
  return m ? `symbol=${m[1]}&mic_code=XPAR` : `symbol=${encodeURIComponent(sym)}`;
}
const td = (path, sym, extra = "") => TQ.push(() => getJSON(`https://api.twelvedata.com/${path}?${sym ? tdSymParams(sym) + "&" : ""}${extra}&apikey=${encodeURIComponent(S.keys.twelve)}`, "twelve"));
const fhSym = s => isFx(s) ? "OANDA:" + s.replace("/", "_") : s;

/* ============================== simulateur ============================== */
// Utilisé uniquement quand aucune source réelle ne répond. Tout ce qui en sort est badgé SIMULÉ.
const SIM_BASE = { AAPL: 230, MSFT: 430, NVDA: 140, TSLA: 250, AMZN: 190, GOOGL: 170, META: 560, SPY: 580, QQQ: 500, DIA: 420, IWM: 220,
  "MC.PA": 640, "TTE.PA": 58, "AIR.PA": 150, "OR.PA": 390, "BNP.PA": 64, "SAN.PA": 95, "EUR/USD": 1.08, "GBP/USD": 1.27, "USD/JPY": 150, "USD/CHF": 0.88,
  "EUR/GBP": 0.85, "EUR/CHF": 0.95, "AUD/USD": 0.66, "USD/CAD": 1.37, VIX: 16, "XAU/USD": 2600, "XAG/USD": 31, "WTI/USD": 72, "BRENT/USD": 76,
  BTCUSDT: 67000, ETHUSDT: 2600, SOLUSDT: 150, BNBUSDT: 580, XRPUSDT: 0.55, DOGEUSDT: 0.12, ADAUSDT: 0.35, PAXGUSDT: 2600, TRXUSDT: 0.16, AVAXUSDT: 26, LINKUSDT: 11, DOTUSDT: 4.3, LTCUSDT: 70,
  XLK: 230, XLF: 47, XLV: 145, XLE: 90, XLY: 200, XLP: 80, XLI: 135, XLB: 90, XLU: 78, XLRE: 42, XLC: 95 };
function hash(s) { let x = 2166136261; for (const c of s) { x ^= c.charCodeAt(0); x = Math.imul(x, 16777619); } return x >>> 0; }
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const Sim = {
  st: {},
  get(sym) {
    if (!this.st[sym]) {
      const r = rng(hash(sym)); const base = SIM_BASE[sym] ?? (isCrypto(sym) ? 0.5 + r() * 40 : 20 + r() * 300);
      const vol = isFx(sym) ? 0.005 : isCrypto(sym) ? 0.03 : 0.015; // volatilité quotidienne
      const prev = base * (1 + (r() - 0.5) * 0.03);
      this.st[sym] = { price: base, prev, open: prev, high: Math.max(base, prev), low: Math.min(base, prev), vol, volume: r() * 1e6, r };
    }
    return this.st[sym];
  },
  tick(sym) {
    const s = this.get(sym);
    const g = (s.r() + s.r() + s.r() - 1.5) * 1.15;
    s.price = Math.max(1e-6, s.price * (1 + g * s.vol / 120 + (s.prev - s.price) / s.prev * 0.002));
    s.high = Math.max(s.high, s.price); s.low = Math.min(s.low, s.price); s.volume += s.r() * 500;
    return s;
  },
  candles(sym, tfSec, n = 400) {
    const s = this.get(sym); const r = rng(hash(sym + tfSec));
    const end = Math.floor(Date.now() / 1000 / tfSec) * tfSec;
    const stepVol = s.vol * Math.sqrt(tfSec / 86400);
    const out = []; let p = s.price;
    for (let i = 0; i < n; i++) {
      const o = p / (1 + (r() + r() + r() - 1.5) * stepVol * 1.4);
      const hi = Math.max(o, p) * (1 + r() * stepVol * 0.8), lo = Math.min(o, p) * (1 - r() * stepVol * 0.8);
      out.push({ time: end - i * tfSec, open: o, high: hi, low: lo, close: p, volume: (0.3 + r()) * 1e5 * Math.sqrt(tfSec / 60) });
      p = o;
    }
    return out.reverse();
  }
};
/* ============================== données de marché ============================== */
const TFS = [
  { k: "1m", s: 60, b: "1m", t: "1min" }, { k: "5m", s: 300, b: "5m", t: "5min" }, { k: "15m", s: 900, b: "15m", t: "15min" },
  { k: "1h", s: 3600, b: "1h", t: "1h" }, { k: "4h", s: 14400, b: "4h", t: "4h" }, { k: "1D", s: 86400, b: "1d", t: "1day" }, { k: "1W", s: 604800, b: "1w", t: "1week" }
];
const FX_CCY = new Set("EUR USD JPY GBP CHF AUD CAD NZD SEK NOK DKK PLN CZK HUF TRY CNY HKD SGD KRW INR MXN BRL ZAR".split(" "));
const BINANCE = "https://api.binance.com/api/v3";
const BINANCE_WS = "wss://stream.binance.com:9443/stream?streams=";

const MD = {
  q: {},            // dernières cotations : sym -> {price, prev, open, high, low, chg, chgPct, volume, src, ts}
  refs: {},         // compteur d'abonnements
  failed: {},       // symboles qu'aucune source réelle ne sert -> simulateur
  cws: null, cwsSet: "", cwsTimer: null, cryptoRest: null,
  fws: null, fwsSubs: new Set(),
  watch(sym) {
    sym = normSym(sym); if (!sym) return;
    this.refs[sym] = (this.refs[sym] || 0) + 1;
    if (this.refs[sym] === 1) this.start(sym);
  },
  unwatch(sym) {
    sym = normSym(sym); if (!this.refs[sym]) return;
    if (--this.refs[sym] === 0) { delete this.refs[sym]; if (isCrypto(sym)) this.syncCrypto(); else this.fwsUnsub(sym); }
  },
  set(sym, patch) {
    const old = this.q[sym] || {};
    const q = Object.assign({}, old, patch, { ts: Date.now() });
    if (q.prev && q.price != null) { q.chg = q.price - q.prev; q.chgPct = q.chg / q.prev * 100; }
    q.dir = old.price == null || q.price === old.price ? 0 : q.price > old.price ? 1 : -1;
    this.q[sym] = q;
    bus.emit("quote", sym, q);
  },
  start(sym) {
    if (isCrypto(sym)) return this.syncCrypto();
    if (this.failed[sym]) return;
    if (S.keys.finnhub) return this.startFinnhub(sym);
    if (S.keys.twelve) return this.startTwelve(sym);
    if (isFx(sym)) return this.startFrankfurter(sym);
    this.failed[sym] = true;
  },
  // ---- crypto : Binance, temps réel et sans clé ----
  syncCrypto() {
    clearTimeout(this.cwsTimer);
    this.cwsTimer = setTimeout(() => {
      const syms = Object.keys(this.refs).filter(isCrypto).sort();
      const key = syms.join(",");
      if (key === this.cwsSet && (this.cws || this.cryptoRest)) return;
      this.cwsSet = key;
      try { this.cws?.close(); } catch { }
      this.cws = null; clearInterval(this.cryptoRest); this.cryptoRest = null;
      if (!syms.length) return;
      this.cryptoSnapshot(syms);
      let opened = false;
      try {
        const ws = new WebSocket(BINANCE_WS + syms.map(s => s.toLowerCase() + "@miniTicker").join("/"));
        this.cws = ws;
        ws.onopen = () => { opened = true; srcSet("binance", "ok"); };
        ws.onmessage = ev => {
          const d = JSON.parse(ev.data).data; if (!d) return;
          delete this.failed[d.s];
          this.set(d.s, { price: +d.c, open: +d.o, prev: +d.o, high: +d.h, low: +d.l, volume: +d.q, src: "live" });
        };
        ws.onclose = () => {
          if (this.cws !== ws) return;
          this.cws = null;
          if (!opened) { srcSet("binance", "err"); this.cryptoPoll(syms); }
          else setTimeout(() => { this.cwsSet = ""; this.syncCrypto(); }, 3000);
        };
      } catch { this.cryptoPoll(syms); }
    }, 250);
  },
  async cryptoSnapshot(syms) {
    try {
      const arr = await getJSON(`${BINANCE}/ticker/24hr?symbols=${encodeURIComponent(JSON.stringify(syms))}`, "binance");
      for (const d of arr) this.set(d.symbol, { price: +d.lastPrice, open: +d.openPrice, prev: +d.openPrice, high: +d.highPrice, low: +d.lowPrice, volume: +d.quoteVolume, src: this.cws ? "live" : "delay" });
      return true;
    } catch {
      syms.forEach(s => { this.failed[s] = true; });
      return false;
    }
  },
  cryptoPoll(syms) {
    clearInterval(this.cryptoRest);

  watched: new Set(),

      if (Math.abs(pos.qty) < 1e-12) { delete this.st.positions[sym]; pos = null; }

function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;

    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }

const HIST = store.get("cmdHist", []); let histI = -1;
function gotoPanel(type) {
  const i = WS.findIndex(w => w.panels.some(p => p.type === type));
  if (i >= 0) { if (i !== curWS) switchWS(i); setTimeout(() => { const inst = WS[i].panels.find(p => p.type === type); $(`.panel[data-id="${inst.id}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" }); }, 50); }
  else { const def = PANELS[type]; const inst = P(type, def.w, def.h); WS[curWS].panels.push(inst); saveWS(); mountPanel(inst, $("#grid")); toast(`Panneau « ${def.title} » ajouté à l'espace courant.`); }
}
function runCommand(raw) {
  const line = raw.trim(); if (!line) return;
  HIST.unshift(line); HIST.length = Math.min(HIST.length, 50); store.set("cmdHist", HIST); histI = -1;
  const t = line.toUpperCase().split(/\s+/), c = t[0];
  const num = v => +String(v).replace(",", ".");
  const opt = (k) => { const i = t.indexOf(k); return i > 0 ? num(t[i + 1]) : null; };
  switch (c) {
    case "HELP": case "AIDE": case "?": return openHelp();
    case "SET": case "REGLAGES": case "RÉGLAGES": case "KEYS": return openSettings();
    case "THEME": case "THÈME": return toggleTheme();
    case "NEWS": case "N": if (t[1]) setActive(t[1]); return gotoPanel("news");
    case "CAL": case "ECO": return gotoPanel("calendar");
    case "ERN": case "EARN": case "DVD": return gotoPanel("earnings");
    case "TAUX": case "RATES": case "WIRP": return gotoPanel("rates");
    case "YC": case "CURVE": case "COURBE": case "GC": return gotoPanel("curve");
    case "BOND": case "OBLIG": case "SPREAD": return gotoPanel("spreads");
    case "MACRO": case "ECST": return gotoPanel("macro");
    case "HEAT": case "MAP": case "IMAP": return gotoPanel("heatmap");
    case "FX": case "CMDTY": case "WEI": return gotoPanel("markets");
    case "SCR": case "SCREEN": case "EQS": return gotoPanel("screener");
    case "VIX": case "VOL": case "FNG": return gotoPanel("sentiment");
    case "JRN": case "JOURNAL": return gotoPanel("journal");
    case "PERF": return gotoPanel("stats");
    case "POS": case "PORT": return gotoPanel("positions");
    case "CALC": case "SIZE": return gotoPanel("calc");
    case "WS": case "TAB": return switchWS(num(t[1]) - 1);
    case "TF": return bus.emit("tf", line.split(/\s+/)[1]?.replace(/^(\d+)([dw])$/i, (_, n, u) => n + u.toUpperCase()).replace(/^(\d+)([HM])$/, (_, n, u) => n + u.toLowerCase()));
    case "W+": case "ADD": { const s = normSym(t[1]); if (s && !S.watch.includes(s)) { S.watch.push(s); save("watch"); MD.watch(s); bus.emit("watchchange"); toast(`${esc(s)} ajouté à la watchlist.`); } return; }
    case "W-": case "DEL": { const s = normSym(t[1]); if (S.watch.includes(s)) { S.watch = S.watch.filter(x => x !== s); save("watch"); MD.unwatch(s); bus.emit("watchchange"); } return; }
    case "ALERT": case "ALERTE": {
      const m = line.toUpperCase().match(/^\S+\s+(\S+)\s*([<>])\s*([\d.,]+)/);
      if (!m) return toast("Syntaxe : ALERT BTCUSDT > 100000", "down");
      return Alerts.add(m[1], m[2], num(m[3]));
    }
    case "BUY": case "SELL": case "ACHAT": case "VENTE": {
      // BUY 10 AAPL [@ 190] [STOP] [SL 180] [TP 210]
      const side = c === "BUY" || c === "ACHAT" ? "buy" : "sell";
      const qty = num(t[1]), sym = t[2], at = t.indexOf("@");
      const price = at > 0 ? num(t[at + 1]) : null;
      if (!(qty > 0) || !sym) return toast("Syntaxe : BUY 10 AAPL [@ 190] [SL 180] [TP 210]", "down");
      MD.watch(sym);
      return PT.order({ sym, side, type: price ? (t.includes("STOP") ? "stop" : "limit") : "market", qty, price, sl: opt("SL"), tp: opt("TP") });
    }
    case "CLOSE": case "FERMER": {
      if (t[1] === "ALL" || t[1] === "TOUT") return Object.keys(PT.st.positions).forEach(s => PT.close(s));
      return PT.close(normSym(t[1] || S.active));
    }
  }
  // sinon : symbole (optionnellement suivi de GO ou d'une unité de temps)
  const sym = normSym(t[0]);
  if (/^[A-Z0-9.\/^:-]{1,20}$/.test(sym)) {
    setActive(sym);
    if (t[1] && t[1] !== "GO") bus.emit("tf", line.split(/\s+/)[1]);
    if (!WS[curWS].panels.some(p => p.type === "chart" && p.state.link !== false)) gotoPanel("chart");
    return;
  }
  toast(`Commande inconnue : ${esc(line)} — tape HELP`, "down");
}
const cmd = $("#cmd");
cmd.addEventListener("keydown", e => {
  if (e.key === "Enter") { runCommand(cmd.value); cmd.value = ""; }
  else if (e.key === "ArrowUp") { histI = Math.min(histI + 1, HIST.length - 1); if (HIST[histI]) cmd.value = HIST[histI]; e.preventDefault(); }
  else if (e.key === "ArrowDown") { histI = Math.max(histI - 1, -1); cmd.value = HIST[histI] || ""; e.preventDefault(); }
  else if (e.key === "Escape") { cmd.value = ""; cmd.blur(); }
});

/* ---------- pricer Black-Scholes ---------- */
const ncdf = x => { const t = 1 / (1 + 0.2316419 * Math.abs(x)), d = 0.3989423 * Math.exp(-x * x / 2), p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return x > 0 ? 1 - p : p; };
const npdf = x => Math.exp(-x * x / 2) / Math.sqrt(2 * Math.PI);
function bs(S, K, T, v, r) {
  if (!(S > 0 && K > 0 && T > 0 && v > 0)) return null;
  const sq = v * Math.sqrt(T), d1 = (Math.log(S / K) + (r + v * v / 2) * T) / sq, d2 = d1 - sq, df = Math.exp(-r * T);
  const call = S * ncdf(d1) - K * df * ncdf(d2), put = K * df * ncdf(-d2) - S * ncdf(-d1);
  const th0 = -S * npdf(d1) * v / (2 * Math.sqrt(T));
  return { call, put, dC: ncdf(d1), dP: ncdf(d1) - 1, gamma: npdf(d1) / (S * sq), vega: S * npdf(d1) * Math.sqrt(T) / 100,
    thC: (th0 - r * K * df * ncdf(d2)) / 365, thP: (th0 + r * K * df * ncdf(-d2)) / 365, rhoC: K * T * df * ncdf(d2) / 100, rhoP: -K * T * df * ncdf(-d2) / 100 };
}
function bsIV(price, S, K, T, r, isCall) { let lo = 0.001, hi = 6; for (let i = 0; i < 90; i++) { const m = (lo + hi) / 2, o = bs(S, K, T, m, r), p = isCall ? o.call : o.put; if (p > price) hi = m; else lo = m; } return (lo + hi) / 2; }
PANELS.bs = {
  title: "Pricer d'options", desc: "Black-Scholes : prix d'un call / put, grecques, volatilité implicite", w: 4, h: 10, pad: true,

      const o = bs(S, K, T, v, r);
      $(".res", body).innerHTML = o ? ivTxt + `<table><thead><tr><th></th><th>Call</th><th>Put</th></tr></thead><tbody>

  init(body, ctx) {

function newsTags(t) { return NEWS_TAGS.filter(([, , re]) => re.test(t)).map(([k]) => k); }
async function newsFeed(name, lang, url) {
  const proxies = typeof FR_PROXIES !== "undefined" ? FR_PROXIES : [u => "https://corsproxy.io/?url=" + encodeURIComponent(u)];
  for (const px of proxies) {
    try {
      const xmlTxt = await getJSON(px(url), "other", { text: true, timeout: 12000 });
      const xml = new DOMParser().parseFromString(xmlTxt, "text/xml");
      const nodes = [...xml.querySelectorAll("item,entry")].slice(0, 25);
      if (!nodes.length) continue;
      return nodes.map(n => {
        const t = (n.querySelector("title")?.textContent || "").replace(/\s+/g, " ").trim(), l = n.querySelector("link");
        const link = l ? (l.getAttribute("href") || l.textContent) : "";
        const d = n.querySelector("pubDate,published,updated")?.textContent || "";
        const desc = (n.querySelector("description,summary")?.textContent || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 260);
        return { src: name, lang, title: t.replace(/\s+-\s+[^-]{2,40}$/, ""), url: link.trim(), t: Date.parse(d) || Date.now(), desc };
      }).filter(x => x.title && Date.now() - x.t < 3 * 86400000);
    } catch { }
  }
  return [];
}

  if (!force && Date.now() - CAL.t < 3600000 && CAL.ev.length) return CAL.ev;

  const [lw, tw, nw] = await Promise.all([get("lastweek"), get("thisweek"), get("nextweek")]);

  const seen = new Set(), ev = [];

    const t = Date.parse(e.date); if (!t) continue;
    const k = t + "|" + e.country + "|" + e.title; if (seen.has(k)) continue; seen.add(k);
    ev.push({ t, cur: e.country, title: e.title, imp: e.impact, f: e.forecast || "", pv: e.previous || "", act: e.actual || "" });
  }

};

    getJSON(`https://www.deribit.com/api/v2/public/get_book_summary_by_currency?currency=${cur}&kind=option`, "deribit").then(d => {
      for (const x of d.result || []) {

        add(p, +x.open_interest, "D");

    getJSON(`${BINANCE}/ticker/price?symbol=${cur}USDT`, "binance").then(d => { res.spot = +d.price; }),
    getJSON(`https://www.deribit.com/api/v2/public/get_volatility_index_data?currency=${cur}&resolution=3600&start_timestamp=${now - 26 * 3600000}&end_timestamp=${now}`, "deribit").then(d => { const a = d.result?.data || []; if (a.length) res.dvol = { now: +a.at(-1)[4], prev: +a[0][4] }; })

  title: "Guide de lecture", desc: "Table des matières qui explique chaque graphique et panneau du terminal : comment le lire et quoi en retenir", w: 12, h: 24,
  init(body, ctx) {
    const st = ctx.inst.state; st.sec ||= "chart";
    body.style.display = "flex"; body.style.minHeight = "0";
    const nav = h("div", { style: "flex:0 0 220px;overflow:auto;border-right:1px solid #1c1c1c;padding:8px 0;background:#050505" });
    const main = h("div", { style: "flex:1;overflow:auto;padding:14px 20px 30px;font-size:13px;line-height:1.6;max-width:820px" });
    body.append(nav, main);
    const css = `<style>.gdoc h2{color:var(--amber);font:700 18px var(--f-body);margin:0 0 4px}.gdoc h3{color:#888;font:600 10.5px var(--f-body);text-transform:uppercase;letter-spacing:.08em;margin:0}.gdoc ul{padding-left:18px;margin:8px 0}.gdoc li{margin:4px 0}.gdoc .gtip{border-left:3px solid var(--amber);background:#120d03;padding:7px 10px;margin:10px 0;font-size:12.5px}.gdoc svg{display:block;margin:8px 0;background:#070707;border:1px solid #1c1c1c}.gnav a{display:block;padding:4px 14px 4px 18px;color:#bbb;cursor:pointer;font-size:12px;text-decoration:none}.gnav a.on{color:#000;background:var(--amber)}.gnav a:hover:not(.on){background:#151515}.gnav b{display:block;padding:10px 14px 3px;color:var(--amber);font-size:10px;text-transform:uppercase;letter-spacing:.08em}</style>`;
    const narrow = () => body.clientWidth < 560;
    function draw() {
      const q = (st.q || "").toLowerCase();
      nav.className = "gnav";
      nav.innerHTML = `<input class="inp gq" type="search" placeholder="Rechercher…" value="${esc(st.q || "")}" style="margin:0 10px 6px;width:calc(100% - 20px);text-transform:none">` + GUIDE.map(([g, items], gi) => { const it = items.filter(x => !q || (x[1] + x[3]).toLowerCase().includes(q)); return it.length ? `<b>${gi + 1}. ${esc(g)}</b>` + it.map(x => `<a data-s="${x[0]}" class="${x[0] === st.sec ? "on" : ""}">${esc(x[1])}</a>`).join("") : ""; }).join("");
      let gi = 0, ii = 0, cur = null;
      GUIDE.forEach(([, items], a) => items.forEach((x, b) => { if (x[0] === st.sec) { cur = x; gi = a; ii = b; } }));
      cur ||= GUIDE[0][1][0];
      const flat = GUIDE.flatMap(([g, items]) => items.map(x => [g, x])), k = flat.findIndex(([, x]) => x === cur), prev = flat[k - 1], next = flat[k + 1];
      main.innerHTML = css + `<div class="gdoc"><h3>${gi + 1}.${ii + 1} · ${esc(GUIDE[gi][0])}</h3><h2>${esc(cur[1])}</h2>${cur[3]}
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn on go" data-p="${cur[2]}">Ouvrir le panneau →</button></div>
        <div style="display:flex;justify-content:space-between;margin-top:22px;padding-top:10px;border-top:1px solid #1c1c1c;font-size:12px">${prev ? `<a data-s="${prev[1][0]}" style="cursor:pointer;color:#bbb">← ${esc(prev[1][1])}</a>` : "<span></span>"}${next ? `<a data-s="${next[1][0]}" style="cursor:pointer;color:var(--amber)">${esc(next[1][1])} →</a>` : ""}</div></div>`;
      nav.style.display = narrow() && st.nav === false ? "none" : "";
      if (narrow()) { nav.style.flex = "0 0 100%"; body.style.flexDirection = "column"; nav.style.maxHeight = "38%"; nav.style.borderRight = "0"; nav.style.borderBottom = "1px solid #1c1c1c"; }
      else { nav.style.flex = "0 0 220px"; body.style.flexDirection = "row"; nav.style.maxHeight = ""; nav.style.borderRight = "1px solid #1c1c1c"; nav.style.borderBottom = "0"; }
    }
    body.addEventListener("click", e => {
      const a = e.target.closest("[data-s]"); if (a) { st.sec = a.dataset.s; ctx.save(); draw(); main.scrollTop = 0; return; }
      const g = e.target.closest(".go"); if (g) gotoPanel(g.dataset.p);
    });
    body.addEventListener("input", e => { if (e.target.classList.contains("gq")) { st.q = e.target.value; const pos = e.target.selectionStart; draw(); const i = $(".gq", nav); i.focus(); i.setSelectionRange(pos, pos); } });
    const ro = new ResizeObserver(() => draw()); ro.observe(body);
    draw();
    return () => ro.disconnect();
  }
};
